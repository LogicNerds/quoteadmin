<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Nerd - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .color-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .color-preview {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-box {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .service-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .service-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .service-info p {
            color: #666;
            font-size: 14px;
        }

        .calculator-url {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .calculator-url h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .url-display {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .auth-container h2 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .logo-preview {
            max-width: 200px;
            max-height: 100px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 768px) {
            .color-input-group {
                grid-template-columns: 1fr;
            }

            .service-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Section -->
    <div id="authSection" class="auth-container">
        <h2>Quote Nerd Admin</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="authEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" placeholder="••••••••">
        </div>
        <button class="btn" onclick="login()" style="width: 100%; margin-bottom: 10px;">Login</button>
        <button class="btn btn-secondary" onclick="signup()" style="width: 100%;">Sign Up</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="hidden">
        <div class="container">
            <div class="header">
                <h1>Quote Nerd Admin Panel</h1>
                <p>Configure your quote calculator</p>
                <button class="btn btn-secondary" onclick="logout()" style="margin-top: 15px;">Logout</button>
            </div>

            <!-- Business Settings -->
            <div class="card">
                <h2>Business Settings</h2>
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" id="businessName" placeholder="Your Business Name">
                </div>
                <div class="form-group">
                    <label>Logo URL (or upload to Firebase Storage)</label>
                    <input type="text" id="logoUrl" placeholder="https://...">
                    <img id="logoPreview" class="logo-preview hidden" alt="Logo Preview">
                </div>
                <div class="form-group">
                    <label>Contact Email</label>
                    <input type="email" id="contactEmail" placeholder="quotes@yourbusiness.com">
                </div>
                <div class="color-input-group">
                    <div class="form-group">
                        <label>Primary Color</label>
                        <div class="color-preview">
                            <input type="color" id="primaryColor" value="#667eea">
                            <div class="color-box" id="primaryColorBox" style="background: #667eea;"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Secondary Color</label>
                        <div class="color-preview">
                            <input type="color" id="secondaryColor" value="#764ba2">
                            <div class="color-box" id="secondaryColorBox" style="background: #764ba2;"></div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-success" onclick="saveBusinessSettings()">Save Business Settings</button>
            </div>

            <!-- Services/Products -->
            <div class="card">
                <h2>Services / Products</h2>
                <div id="servicesList"></div>
                
                <h3 style="margin-top: 30px; margin-bottom: 15px;">Add New Service</h3>
                <div class="form-group">
                    <label>Service Name</label>
                    <input type="text" id="serviceName" placeholder="e.g., Basic Website">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="serviceDescription" rows="3" placeholder="Brief description of the service"></textarea>
                </div>
                <div class="form-group">
                    <label>Base Price ($)</label>
                    <input type="number" id="servicePrice" placeholder="1000">
                </div>
                <div class="form-group">
                    <label>Price Type</label>
                    <select id="priceType">
                        <option value="fixed">Fixed Price</option>
                        <option value="perUnit">Per Unit/Hour</option>
                        <option value="custom">Custom Calculation</option>
                    </select>
                </div>
                <button class="btn btn-success" onclick="addService()">Add Service</button>
            </div>

            <!-- Calculator URL -->
            <div class="card">
                <h2>Your Calculator</h2>
                <div class="calculator-url">
                    <h3>Share this link with customers:</h3>
                    <div class="url-display" id="calculatorUrl">Loading...</div>
                    <button class="btn" onclick="copyUrl()">Copy URL</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // FIREBASE CONFIGURATION - REPLACE WITH YOUR CREDENTIALS
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.currentUser = null;

        // Auth state listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                await loadBusinessData();
            } else {
                window.currentUser = null;
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            }
        });

        // Make functions globally available
        window.signup = signup;
        window.login = login;
        window.logout = logout;
        window.saveBusinessSettings = saveBusinessSettings;
        window.addService = addService;
        window.deleteService = deleteService;
        window.loadBusinessData = loadBusinessData;
        window.copyUrl = copyUrl;
    </script>

    <script>
        // Auth Functions
        async function signup() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                console.log('User created:', userCredential.user.uid);
            } catch (error) {
                alert('Signup error: ' + error.message);
            }
        }

        async function login() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        }

        async function logout() {
            await signOut(auth);
        }

        // Business Settings
        async function saveBusinessSettings() {
            if (!currentUser) return;

            const businessData = {
                businessName: document.getElementById('businessName').value,
                logoUrl: document.getElementById('logoUrl').value,
                contactEmail: document.getElementById('contactEmail').value,
                primaryColor: document.getElementById('primaryColor').value,
                secondaryColor: document.getElementById('secondaryColor').value,
                updatedAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, 'businesses', currentUser.uid), businessData, { merge: true });
                alert('Business settings saved!');
                updateCalculatorUrl();
            } catch (error) {
                alert('Error saving: ' + error.message);
            }
        }

        // Services Management
        async function addService() {
            if (!currentUser) return;

            const serviceData = {
                businessId: currentUser.uid,
                name: document.getElementById('serviceName').value,
                description: document.getElementById('serviceDescription').value,
                basePrice: parseFloat(document.getElementById('servicePrice').value),
                priceType: document.getElementById('priceType').value,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, 'services'), serviceData);
                document.getElementById('serviceName').value = '';
                document.getElementById('serviceDescription').value = '';
                document.getElementById('servicePrice').value = '';
                await loadServices();
            } catch (error) {
                alert('Error adding service: ' + error.message);
            }
        }

        async function deleteService(serviceId) {
            if (!confirm('Delete this service?')) return;

            try {
                await deleteDoc(doc(db, 'services', serviceId));
                await loadServices();
            } catch (error) {
                alert('Error deleting: ' + error.message);
            }
        }

        async function loadServices() {
            if (!currentUser) return;

            const servicesQuery = query(collection(db, 'services'), where('businessId', '==', currentUser.uid));
            const snapshot = await getDocs(servicesQuery);
            
            const servicesList = document.getElementById('servicesList');
            servicesList.innerHTML = '';

            snapshot.forEach((doc) => {
                const service = doc.data();
                const serviceItem = document.createElement('div');
                serviceItem.className = 'service-item';
                serviceItem.innerHTML = `
                    <div class="service-info">
                        <h4>${service.name}</h4>
                        <p>${service.description} - $${service.basePrice} (${service.priceType})</p>
                    </div>
                    <button class="btn btn-danger" onclick="deleteService('${doc.id}')">Delete</button>
                `;
                servicesList.appendChild(serviceItem);
            });
        }

        async function loadBusinessData() {
            if (!currentUser) return;

            try {
                const businessDoc = await getDoc(doc(db, 'businesses', currentUser.uid));
                if (businessDoc.exists()) {
                    const data = businessDoc.data();
                    document.getElementById('businessName').value = data.businessName || '';
                    document.getElementById('logoUrl').value = data.logoUrl || '';
                    document.getElementById('contactEmail').value = data.contactEmail || '';
                    document.getElementById('primaryColor').value = data.primaryColor || '#667eea';
                    document.getElementById('secondaryColor').value = data.secondaryColor || '#764ba2';
                    
                    if (data.logoUrl) {
                        document.getElementById('logoPreview').src = data.logoUrl;
                        document.getElementById('logoPreview').classList.remove('hidden');
                    }
                }
                await loadServices();
                updateCalculatorUrl();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function updateCalculatorUrl() {
            if (!currentUser) return;
            const baseUrl = window.location.origin;
            const calculatorUrl = `${baseUrl}/quote-nerd-calculator.html?id=${currentUser.uid}`;
            document.getElementById('calculatorUrl').textContent = calculatorUrl;
        }

        function copyUrl() {
            const url = document.getElementById('calculatorUrl').textContent;
            navigator.clipboard.writeText(url);
            alert('URL copied to clipboard!');
        }

        // Color preview updates
        document.getElementById('primaryColor')?.addEventListener('input', (e) => {
            document.getElementById('primaryColorBox').style.background = e.target.value;
        });

        document.getElementById('secondaryColor')?.addEventListener('input', (e) => {
            document.getElementById('secondaryColorBox').style.background = e.target.value;
        });

        document.getElementById('logoUrl')?.addEventListener('input', (e) => {
            const preview = document.getElementById('logoPreview');
            if (e.target.value) {
                preview.src = e.target.value;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
